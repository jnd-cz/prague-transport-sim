<!doctype html>
<meta charset="utf-8">
<title>Tile container bench</title>
<!-- tools/bench/tile_container.py (#307): decode both formats and build a geometry, timed in the page; the differences also in a worker. -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// [nv, nt] u32, then zigzag varints: vertices (x, y, z cm) and triangles as differences (tile_container.py delta)
function decodeDelta(buf) {
  const head = new Uint32Array(buf, 0, 2), nv = head[0], nt = head[1], b = new Uint8Array(buf);
  const pos = new Float32Array(nv * 3), idx = new Uint32Array(nt * 3);
  let p = 8;
  const next = () => {
    let v = 0, m = 1, c;
    do { c = b[p++]; v += (c & 127) * m; m *= 128; } while (c >= 128);
    return v % 2 ? -(v + 1) / 2 : v / 2;
  };
  let x = 0, y = 0, z = 0;
  for (let i = 0; i < nv; i++) {
    x += next(); y += next(); z += next();
    pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z / 100;
  }
  let prev = 0;
  for (let i = 0; i < nt; i++) {
    const a = prev + next(), c = prev + next(), d = prev + next();
    idx[i * 3] = a; idx[i * 3 + 1] = c; idx[i * 3 + 2] = d;
    prev = a;
  }
  return { pos, idx };
}

const median = (a) => a.slice().sort((x, y) => x - y)[a.length >> 1];

window.run = async (runs) => {
  const [delta, glb] = await Promise.all(['tile.delta', 'tile.glb'].map((n) => fetch(`/reports/tile_container/${n}`).then((r) => r.arrayBuffer())));
  const loader = new GLTFLoader(), out = {};
  const timings = { delta: [], deltaNormals: [], glb: [], glbNormals: [] };
  for (let r = 0; r < runs; r++) {
    let t = performance.now();
    const { pos, idx } = decodeDelta(delta);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    timings.delta.push(performance.now() - t);
    t = performance.now();
    g.computeVertexNormals();
    timings.deltaNormals.push(performance.now() - t);
    t = performance.now();
    const gl = await loader.parseAsync(glb.slice(0), '');
    const mesh = gl.scene.children[0];
    timings.glb.push(performance.now() - t);
    t = performance.now();
    mesh.geometry.computeVertexNormals();
    timings.glbNormals.push(performance.now() - t);
    out.glbType = mesh.geometry.attributes.position.array.constructor.name;
    out.count = [g.index.count, mesh.geometry.index.count];
    const b = new THREE.Box3().setFromBufferAttribute(g.attributes.position), c = new THREE.Box3().setFromObject(mesh);
    out.boxes = [b.min.toArray().concat(b.max.toArray()).map((v) => +v.toFixed(2)), c.min.toArray().concat(c.max.toArray()).map((v) => +v.toFixed(2))];
  }
  for (const k in timings) out[k] = +median(timings[k]).toFixed(1);
  return out;
};

// The same decoder in a worker, normals too; the arrays come back without a copy. No Three.js in there: it needs none.
const workerSource = `const decodeDelta = ${decodeDelta};
function normals(pos, idx) {
  const n = new Float32Array(pos.length);
  for (let i = 0; i < idx.length; i += 3) {
    const a = idx[i] * 3, b = idx[i + 1] * 3, c = idx[i + 2] * 3;
    const ux = pos[b] - pos[a], uy = pos[b + 1] - pos[a + 1], uz = pos[b + 2] - pos[a + 2];
    const vx = pos[c] - pos[a], vy = pos[c + 1] - pos[a + 1], vz = pos[c + 2] - pos[a + 2];
    const x = uy * vz - uz * vy, y = uz * vx - ux * vz, z = ux * vy - uy * vx;
    for (const k of [a, b, c]) { n[k] += x; n[k + 1] += y; n[k + 2] += z; }
  }
  for (let i = 0; i < n.length; i += 3) {
    const l = Math.hypot(n[i], n[i + 1], n[i + 2]) || 1;
    n[i] /= l; n[i + 1] /= l; n[i + 2] /= l;
  }
  return n;
}
onmessage = ({ data }) => {
  const t = performance.now();
  const { pos, idx } = decodeDelta(data);
  const t1 = performance.now();
  const nor = normals(pos, idx);
  postMessage({ pos, idx, nor, decode: t1 - t, normals: performance.now() - t1 }, [pos.buffer, idx.buffer, nor.buffer]);
};`;

window.runWorker = async (runs) => {
  const buf = await fetch('/reports/tile_container/tile.delta').then((r) => r.arrayBuffer());
  const w = new Worker(URL.createObjectURL(new Blob([workerSource], { type: 'text/javascript' })));
  const timings = { decode: [], normals: [], page: [] };
  // the page's thread kept busy with messages: the longest gap between two is its longest stall during the loads
  const ch = new MessageChannel();
  let last = performance.now(), gap = 0, on = true;
  ch.port1.onmessage = () => { const n = performance.now(); gap = Math.max(gap, n - last); last = n; if (on) ch.port2.postMessage(0); };
  ch.port2.postMessage(0);
  for (let r = 0; r < runs; r++) {
    await new Promise((done) => {
      w.onmessage = ({ data }) => {
        const t = performance.now(), g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.BufferAttribute(data.pos, 3));
        g.setAttribute('normal', new THREE.BufferAttribute(data.nor, 3));
        g.setIndex(new THREE.BufferAttribute(data.idx, 1));
        timings.page.push(performance.now() - t);
        timings.decode.push(data.decode);
        timings.normals.push(data.normals);
        done();
      };
      const copy = buf.slice(0);
      w.postMessage(copy, [copy]);
    });
  }
  on = false;
  w.terminate();
  const out = { longestStall: +gap.toFixed(1) };
  for (const k in timings) out[k] = +median(timings[k]).toFixed(2);
  return out;
};
window.ready = true;
</script>
