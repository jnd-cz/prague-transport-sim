<!doctype html>
<meta charset="utf-8">
<title>Object container bench</title>
<!-- tools/bench/object_container.py (#307): one tile's objects in each format, decoded to the same triangles, timed in the page; the differences also in a worker. -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const FILES = '/reports/object_container/';
const get = (n) => fetch(FILES + n).then((r) => r.arrayBuffer());
const median = (a) => a.slice().sort((x, y) => x - y)[a.length >> 1];

// [nb, nv, nt] u32, the lattice's origin 3 i32, its step 3 f64; varints: per building nv, nt, kind; then vertices and triangles as differences
function decodeDelta(buf) {
  const h = new DataView(buf), nb = h.getUint32(0, true), nv = h.getUint32(4, true), nt = h.getUint32(8, true);
  const qx = h.getFloat64(24, true), qy = h.getFloat64(32, true), qz = h.getFloat64(40, true), b = new Uint8Array(buf);
  const pos = new Float32Array(nv * 3), idx = new Uint32Array(nt * 3), counts = new Uint32Array(nb), kinds = new Uint8Array(nb);
  let p = 48;
  const uint = () => {
    let v = 0, m = 1, c;
    do { c = b[p++]; v += (c & 127) * m; m *= 128; } while (c >= 128);
    return v;
  };
  const next = () => { const v = uint(); return v % 2 ? -(v + 1) / 2 : v / 2; };
  for (let i = 0; i < nb; i++) { uint(); counts[i] = uint() * 3; kinds[i] = uint(); }
  let x = 0, y = 0, z = 0;
  for (let i = 0; i < nv; i++) {
    x += next(); y += next(); z += next();
    pos[i * 3] = x * qx; pos[i * 3 + 1] = y * qy; pos[i * 3 + 2] = z * qz;
  }
  let prev = 0;
  for (let i = 0; i < nt; i++) {
    const a = prev + next(), c = prev + next(), d = prev + next();
    idx[i * 3] = a; idx[i * 3 + 1] = c; idx[i * 3 + 2] = d;
    prev = a;
  }
  return { pos, idx, counts, kinds };
}

// the triangles with their face's normal: what a building ends up as in every format
function flat(pos, idx) {
  const n = idx ? idx.length : pos.length / 3, out = new Float32Array(n * 3), nor = new Float32Array(n * 3);
  for (let t = 0; t < n; t += 3) {
    const a = (idx ? idx[t] : t) * 3, b = (idx ? idx[t + 1] : t + 1) * 3, c = (idx ? idx[t + 2] : t + 2) * 3, o = t * 3;
    const ax = pos[a], ay = pos[a + 1], az = pos[a + 2], bx = pos[b], by = pos[b + 1], bz = pos[b + 2], cx = pos[c], cy = pos[c + 1], cz = pos[c + 2];
    out[o] = ax; out[o + 1] = ay; out[o + 2] = az; out[o + 3] = bx; out[o + 4] = by; out[o + 5] = bz; out[o + 6] = cx; out[o + 7] = cy; out[o + 8] = cz;
    const ux = bx - ax, uy = by - ay, uz = bz - az, vx = cx - ax, vy = cy - ay, vz = cz - az;
    let x = uy * vz - uz * vy, y = uz * vx - ux * vz, z = ux * vy - uy * vx;
    const l = Math.hypot(x, y, z) || 1;
    x /= l; y /= l; z /= l;
    for (let k = 0; k < 9; k += 3) { nor[o + k] = x; nor[o + k + 1] = y; nor[o + k + 2] = z; }
  }
  return { out, nor };
}

function decodeToday(buf, q) {
  const len = new DataView(buf).getUint32(0, true);
  const t = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, len)));
  const a = new Uint16Array(buf, 4 + len), pos = new Float32Array(a.length);
  for (let i = 0; i < a.length; i++) pos[i] = a[i] * q;
  return { pos, idx: null, counts: t.b, kinds: t.k };
}

async function decodeGlb(buf, loader) {
  const gl = await loader.parseAsync(buf, '');
  const mesh = gl.scene.children[0], g = mesh.geometry, at = g.attributes.position, s = mesh.scale.x;
  const a = at.data.array, stride = at.data.stride, n = at.count, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const k = i * stride;
    pos[i * 3] = a[k] * s; pos[i * 3 + 1] = a[k + 1] * s; pos[i * 3 + 2] = a[k + 2] * s;
  }
  return { pos, idx: g.index ? g.index.array : null, counts: mesh.userData.b, kinds: mesh.userData.k };
}

window.runBuildings = async (runs) => {
  const meta = await fetch(FILES + 'meta.json').then((r) => r.json()), q = meta.q, loader = new GLTFLoader();
  const named = { today: await get('bld.today'), glb: await get('bld.glb'), glbIndexed: await get('bld-indexed.glb'), delta: await get('bld.delta') };
  const dec = {
    today: async (b) => decodeToday(b, q),
    glb: (b) => decodeGlb(b.slice(0), loader),
    glbIndexed: (b) => decodeGlb(b.slice(0), loader),
    delta: async (b) => decodeDelta(b),
  };
  const out = {}, results = {};
  for (const k in named) {
    const td = [], tf = [];
    for (let r = 0; r < runs; r++) {
      let t = performance.now();
      const d = await dec[k](named[k]);
      td.push(performance.now() - t);
      t = performance.now();
      results[k] = { ...flat(d.pos, d.idx), counts: d.counts, kinds: d.kinds };
      tf.push(performance.now() - t);
    }
    out[k] = { decode: +median(td).toFixed(1), flat: +median(tf).toFixed(1) };
  }
  // every format has to give the same triangles, normals and table
  const ref = results.today;
  for (const k in results) {
    const r = results[k];
    let dp = 0, dn = 0;
    if (r.out.length !== ref.out.length) throw new Error(`${k}: ${r.out.length} against ${ref.out.length} values`);
    for (let i = 0; i < r.out.length; i++) { dp = Math.max(dp, Math.abs(r.out[i] - ref.out[i])); dn = Math.max(dn, Math.abs(r.nor[i] - ref.nor[i])); }
    out[k].maxPositionDifference = +dp.toFixed(5);
    out[k].maxNormalDifference = +dn.toFixed(5);
    out[k].sameTable = Array.from(r.counts).join() === Array.from(ref.counts).join() && Array.from(r.kinds).join() === Array.from(ref.kinds).join();
  }
  out.triangles = ref.out.length / 9;
  return out;
};

function decodeTreesDelta(buf) {
  const h = new DataView(buf), n = h.getUint32(0, true), nk = h.getUint32(4, true), lx = h.getInt32(8, true), ly = h.getInt32(12, true), b = new Uint8Array(buf);
  let p = 16;
  const uint = () => {
    let v = 0, m = 1, c;
    do { c = b[p++]; v += (c & 127) * m; m *= 128; } while (c >= 128);
    return v;
  };
  const next = () => { const v = uint(); return v % 2 ? -(v + 1) / 2 : v / 2; };
  const kinds = [], xy = new Float32Array(n * 2);
  for (let i = 0; i < nk; i++) { const k = uint(), c = uint(); kinds.push([k, c]); }
  let x = 0, y = 0;
  for (let i = 0; i < n; i++) { x += next(); y += next(); xy[i * 2] = x * 0.1; xy[i * 2 + 1] = y * 0.1; }
  return { kinds, xy, lo: [lx * 0.1, ly * 0.1] };
}

window.runTrees = async (runs) => {
  const loader = new GLTFLoader();
  const [js, glb, delta] = await Promise.all(['trees.json', 'trees.glb', 'trees.delta'].map(get));
  const t = { json: [], glb: [], delta: [] };
  let a, g, d;
  for (let r = 0; r < runs; r++) {
    let s = performance.now();
    a = JSON.parse(new TextDecoder().decode(js));
    t.json.push(performance.now() - s);
    s = performance.now();
    g = await loader.parseAsync(glb.slice(0), '');
    t.glb.push(performance.now() - s);
    s = performance.now();
    d = decodeTreesDelta(delta);
    t.delta.push(performance.now() - s);
  }
  // the same things in all three, by kind, and the same places (sum of x + y, in metres)
  const byKind = (l) => l.reduce((m, e) => { m[e[2]] = (m[e[2]] || 0) + 1; return m; }, {});
  const glbCounts = {};
  let glbSum = 0;
  g.scene.traverse((o) => {
    if (!o.isInstancedMesh) return;
    glbCounts[o.parent.userData.k ?? o.userData.k] = o.count;
    const m = o.instanceMatrix.array;
    for (let i = 0; i < o.count; i++) glbSum += m[i * 16 + 12] + m[i * 16 + 13];
  });
  const lo = d.lo;
  let deltaSum = 0;
  for (let i = 0; i < d.xy.length; i++) deltaSum += d.xy[i];
  const n = a.length, jsonSum = a.reduce((s, e) => s + e[0] + e[1], 0);
  return {
    json: +median(t.json).toFixed(2), glb: +median(t.glb).toFixed(2), delta: +median(t.delta).toFixed(2), count: n,
    jsonKinds: byKind(a), glbKinds: glbCounts, deltaKinds: Object.fromEntries(d.kinds),
    mean: { json: +((jsonSum / n)).toFixed(2), delta: +((deltaSum / n + lo[0] + lo[1])).toFixed(2), glb: +((glbSum / n + lo[0] + lo[1])).toFixed(2) },
  };
};

const workerSource = `const decodeDelta = ${decodeDelta};
const flat = ${flat};
onmessage = ({ data }) => {
  const t = performance.now();
  const d = decodeDelta(data);
  const t1 = performance.now();
  const { out, nor } = flat(d.pos, d.idx);
  postMessage({ out, nor, counts: d.counts, kinds: d.kinds, decode: t1 - t, flat: performance.now() - t1 }, [out.buffer, nor.buffer, d.counts.buffer, d.kinds.buffer]);
};`;

window.runWorker = async (runs) => {
  const buf = await get('bld.delta');
  const w = new Worker(URL.createObjectURL(new Blob([workerSource], { type: 'text/javascript' })));
  const timings = { decode: [], flat: [] };
  const ch = new MessageChannel();
  let last = performance.now(), gap = 0, on = true;
  ch.port1.onmessage = () => { const n = performance.now(); gap = Math.max(gap, n - last); last = n; if (on) ch.port2.postMessage(0); };
  ch.port2.postMessage(0);
  for (let r = 0; r < runs; r++) {
    await new Promise((done) => {
      w.onmessage = ({ data }) => { timings.decode.push(data.decode); timings.flat.push(data.flat); done(); };
      const copy = buf.slice(0);
      w.postMessage(copy, [copy]);
    });
  }
  on = false;
  w.terminate();
  return { decode: +median(timings.decode).toFixed(1), flat: +median(timings.flat).toFixed(1), longestStall: +gap.toFixed(1) };
};
window.ready = true;
</script>
